<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-full-title architecture-full-desc">
  <title id="architecture-full-title">Content site in production</title>
  <desc id="architecture-full-desc">Full editorial architecture diagram showing reader requests moving through Cloudflare to an Astro origin, MDX bundle, and content CMS, with summary callout panels.</desc>
  <defs>
    <pattern id="architecture-full-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
    </pattern>
    <marker id="architecture-full-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="architecture-full-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="architecture-full-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <!-- Sheet paper background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>

  <!-- Editorial header band -->
  <text x="40" y="40" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ARCHITECTURE · DIAGRAM DESIGN</text>
  <text x="40" y="76" fill="#2d3142" font-size="28" font-weight="400" font-family="'Instrument Serif', 'Noto Serif', serif" letter-spacing="-0.02em">Content site in production</text>
  <text x="40" y="100" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif">The static-first stack: Cloudflare's edge absorbs most reads, Astro renders MDX on misses,</text>
  <text x="40" y="116" fill="#4f5d75" font-size="11" font-weight="400" font-family="'Geist', system-ui, sans-serif">content is checked into the repo.</text>

  <!-- Framed diagram container -->
  <rect x="40" y="136" width="920" height="408" rx="8" fill="#ececec" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
  <rect x="52" y="148" width="896" height="384" rx="4" fill="#f5f5f5"/>
  <rect x="52" y="148" width="896" height="384" rx="4" fill="url(#architecture-full-dots)" opacity="0.55"/>

  <!-- Zone: Content services (drawn before arrows and nodes) -->
  <rect x="660" y="168" width="164" height="272" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="716" y="172" width="52" height="12" rx="2" fill="#f5f5f5"/>
  <text x="742" y="181" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CONTENT</text>

  <!-- Arrows first (behind boxes) -->
  <line x1="212" y1="312" x2="264" y2="312" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-full-arrow-link)"/>
  <line x1="408" y1="312" x2="460" y2="312" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-full-arrow-accent)"/>
  <path d="M 620,300 H 736 Q 744,300 744,292 V 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-full-arrow)"/>
  <path d="M 620,324 H 736 Q 744,324 744,332 V 360" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#architecture-full-arrow)"/>

  <!-- Dashed return: Cloudflare to Reader (cached HTML) -->
  <path d="M 264,328 H 212" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-full-arrow)"/>

  <!-- Arrow labels -->
  <rect x="216" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="240" y="302" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

  <rect x="216" y="318" width="32" height="12" rx="2" fill="#f5f5f5"/>
  <text x="232" y="327" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESP</text>

  <rect x="412" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>
  <text x="436" y="302" fill="#bf4520" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SSR</text>

  <rect x="676" y="280" width="60" height="12" rx="2" fill="#f5f5f5"/>
  <text x="706" y="289" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READ MDX</text>

  <rect x="676" y="332" width="44" height="12" rx="2" fill="#f5f5f5"/>
  <text x="698" y="341" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

  <!-- Node: Reader -->
  <rect x="84" y="280" width="128" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="84" y="280" width="128" height="64" rx="6" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
  <rect x="92" y="288" width="28" height="12" rx="2" fill="none" stroke="#5a6580" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="106" y="297" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="148" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Reader</text>
  <text x="148" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Browser</text>

  <!-- Node: Cloudflare -->
  <rect x="264" y="280" width="144" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="264" y="280" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="272" y="288" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.22" stroke-width="0.8"/>
  <text x="288" y="297" fill="#5a6580" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
  <text x="400" y="340" fill="#2d3142" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">01</text>
  <text x="336" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cloudflare</text>
  <text x="336" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Pages · cache</text>

  <!-- Node: Astro (focal) -->
  <rect x="460" y="280" width="160" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="460" y="280" width="160" height="64" rx="6" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
  <rect x="468" y="288" width="32" height="12" rx="2" fill="none" stroke="#bf4520" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="484" y="297" fill="#bf4520" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
  <text x="612" y="340" fill="#bf4520" fill-opacity="0.10" font-size="32" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">02</text>
  <text x="540" y="316" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Astro Origin</text>
  <text x="540" y="332" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SSR + MDX</text>

  <!-- Node: MDX Bundle -->
  <rect x="672" y="200" width="144" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="672" y="200" width="144" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="680" y="208" width="32" height="12" rx="2" fill="none" stroke="#2d3142" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="696" y="217" fill="#2d3142" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BUN</text>
  <text x="744" y="236" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MDX Bundle</text>
  <text x="744" y="252" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/content/*.mdx</text>

  <!-- Node: Content CMS -->
  <rect x="672" y="360" width="144" height="64" rx="6" fill="#f5f5f5"/>
  <rect x="672" y="360" width="144" height="64" rx="6" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <rect x="680" y="368" width="28" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="694" y="377" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CMS</text>
  <text x="744" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Content CMS</text>
  <text x="744" y="412" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">assets · og images</text>

  <!-- Legend strip inside diagram plate -->
  <line x1="72" y1="456" x2="928" y2="456" stroke="#2d3142" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="72" y="472" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="72" y="488" width="14" height="10" rx="2" fill="#bf4520" fill-opacity="0.08" stroke="#bf4520" stroke-width="1"/>
  <text x="92" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal / origin</text>

  <rect x="184" y="488" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="204" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Backend / bundle</text>

  <rect x="312" y="488" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.05" stroke="#4f5d75" stroke-width="1"/>
  <text x="332" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Store</text>

  <rect x="384" y="488" width="14" height="10" rx="2" fill="#2d3142" fill-opacity="0.03" stroke="#2d3142" stroke-opacity="0.30" stroke-width="1"/>
  <text x="404" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Cloud</text>

  <rect x="460" y="488" width="14" height="10" rx="2" fill="#4f5d75" fill-opacity="0.10" stroke="#5a6580" stroke-width="1"/>
  <text x="480" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External</text>

  <line x1="548" y1="494" x2="576" y2="494" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#architecture-full-arrow-link)"/>
  <text x="584" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP request</text>

  <line x1="676" y1="494" x2="704" y2="494" stroke="#bf4520" stroke-width="1.4" marker-end="url(#architecture-full-arrow-accent)"/>
  <text x="712" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Primary flow</text>

  <line x1="800" y1="494" x2="828" y2="494" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-full-arrow)"/>
  <text x="836" y="496" fill="#4f5d75" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return / async</text>

  <!-- Editorial summary cards (varied widths: 324 / 296 / 268 on 4px grid) -->
  <!-- Card 1: Headline -->
  <rect x="40" y="560" width="324" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
  <text x="56" y="580" fill="#4f5d75" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">THE HEADLINE</text>
  <circle cx="60" cy="596" r="3.5" fill="#bf4520"/>
  <text x="72" y="600" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Edge absorbs the reads</text>
  <line x1="56" y1="612" x2="348" y2="612" stroke="#2d3142" stroke-opacity="0.08" stroke-width="1"/>
  <text x="56" y="632" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">Nearly every reader is served by Cloudflare's</text>
  <text x="56" y="648" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">edge cache. The Astro origin only wakes on</text>
  <text x="56" y="664" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">a cold slug or a revalidation.</text>

  <!-- Card 2: Repo content -->
  <rect x="380" y="560" width="296" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="400" cy="588" r="3.5" fill="#2d3142"/>
  <text x="412" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">Content lives in the repo</text>
  <line x1="396" y1="604" x2="660" y2="604" stroke="#2d3142" stroke-opacity="0.08" stroke-width="1"/>
  <text x="396" y="624" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">· Posts are MDX files</text>
  <text x="396" y="644" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">· Checked in, reviewed in PRs</text>
  <text x="396" y="664" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">· No runtime database</text>

  <!-- Card 3: CMS assets -->
  <rect x="692" y="560" width="268" height="140" rx="6" fill="#ffffff" stroke="#2d3142" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="712" cy="588" r="3.5" fill="#4f5d75"/>
  <text x="724" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif">CMS holds the big stuff</text>
  <line x1="708" y1="604" x2="944" y2="604" stroke="#2d3142" stroke-opacity="0.08" stroke-width="1"/>
  <text x="708" y="624" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">Images, OG art, and downloadable</text>
  <text x="708" y="640" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">assets live in a separate bucket</text>
  <text x="708" y="656" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">keyed by slug. Astro links them</text>
  <text x="708" y="672" fill="#4f5d75" font-size="10" font-family="'Geist', system-ui, sans-serif">at render time.</text>

  <!-- Footer -->
  <line x1="40" y1="720" x2="960" y2="720" stroke="#2d3142" stroke-opacity="0.10" stroke-width="1"/>
  <text x="40" y="740" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em">content site · architecture</text>
  <text x="960" y="740" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.06em" text-anchor="end">example · schematic skill</text>
</svg>

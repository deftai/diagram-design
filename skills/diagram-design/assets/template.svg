<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 696" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc">
  <title id="[diagram-slug]-title">[Diagram title]</title>
  <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
  <defs>
    <marker id="[diagram-slug]-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="[diagram-slug]-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
    </marker>
    <marker id="[diagram-slug]-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
    <!-- OPTIONAL: dot-pattern background. Uncomment the pattern and overlay rect below for dotted paper. -->
    <!--
    <pattern id="[diagram-slug]-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#2d3142" fill-opacity="0.10"/>
    </pattern>
    -->
  </defs>

  <!-- Paper background -->
  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <!-- <rect width="100%" height="100%" fill="url(#[diagram-slug]-dots)" opacity="0.55"/> -->

  <!-- Top band (96px tall, 4px grid): eyebrow and title -->
  <text x="40" y="40" fill="#4f5d75" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">[TYPE] · DIAGRAM DESIGN</text>
  <text x="40" y="76" fill="#2d3142" font-size="28" font-weight="400" font-family="'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif" letter-spacing="-0.02em">[Diagram title]</text>

  <!-- Diagram canvas starts at y=96 (960x600 area below top band). Draw zones, then arrows, then labels, then nodes. -->
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1000 504" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
  <title id="architecture-dark-title">Content site in production</title>
  <desc id="architecture-dark-desc">Architecture diagram showing reader requests moving through Cloudflare to an Astro origin, MDX bundle, and content CMS.</desc>
  <defs>
    <pattern id="architecture-dark-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="#f5f5f5" fill-opacity="0.10"/>
    </pattern>
    <marker id="architecture-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/>
    </marker>
    <marker id="architecture-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#f08a59"/>
    </marker>
    <marker id="architecture-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#739fdf"/>
    </marker>
  </defs>

  <!-- Paper background -->
  <rect width="100%" height="100%" fill="#2d3142"/>
  <rect width="100%" height="100%" fill="url(#architecture-dark-dots)" opacity="0.55"/>

  <!-- Top band: eyebrow and title -->
  <text x="40" y="40" fill="#bfc0c0" font-size="8" font-weight="500" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">ARCHITECTURE · DIAGRAM DESIGN</text>
  <text x="40" y="76" fill="#f5f5f5" font-size="28" font-weight="400" font-family="'Instrument Serif', 'Noto Serif', serif" letter-spacing="-0.02em">Content site in production</text>

  <!-- Zone: Content services (drawn before arrows and nodes) -->
  <rect x="616" y="152" width="164" height="272" rx="8" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
  <rect x="672" y="156" width="52" height="12" rx="2" fill="#2d3142"/>
  <text x="698" y="165" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">CONTENT</text>

  <!-- Arrows first (behind boxes) -->
  <line x1="168" y1="296" x2="220" y2="296" stroke="#739fdf" stroke-width="1.2" marker-end="url(#architecture-dark-arrow-link)"/>
  <line x1="364" y1="296" x2="416" y2="296" stroke="#f08a59" stroke-width="1.4" marker-end="url(#architecture-dark-arrow-accent)"/>
  <path d="M 576,284 H 692 Q 700,284 700,276 V 248" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>
  <path d="M 576,308 H 692 Q 700,308 700,316 V 344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#architecture-dark-arrow)"/>

  <!-- Dashed return: Cloudflare to Reader (cached HTML) -->
  <path d="M 220,312 H 168" fill="none" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-dark-arrow)"/>

  <!-- Arrow labels -->
  <rect x="172" y="276" width="48" height="12" rx="2" fill="#2d3142"/>
  <text x="196" y="286" fill="#739fdf" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

  <rect x="172" y="302" width="32" height="12" rx="2" fill="#2d3142"/>
  <text x="188" y="311" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">RESP</text>

  <rect x="368" y="276" width="48" height="12" rx="2" fill="#2d3142"/>
  <text x="392" y="286" fill="#f08a59" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">SSR</text>

  <rect x="632" y="264" width="60" height="12" rx="2" fill="#2d3142"/>
  <text x="662" y="273" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">READ MDX</text>

  <rect x="632" y="316" width="44" height="12" rx="2" fill="#2d3142"/>
  <text x="654" y="325" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

  <!-- Node: Reader -->
  <rect x="40" y="264" width="128" height="64" rx="6" fill="#2d3142"/>
  <rect x="40" y="264" width="128" height="64" rx="6" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
  <rect x="48" y="272" width="28" height="12" rx="2" fill="none" stroke="#949eb2" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="62" y="281" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
  <text x="104" y="300" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Reader</text>
  <text x="104" y="316" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Browser</text>

  <!-- Node: Cloudflare -->
  <rect x="220" y="264" width="144" height="64" rx="6" fill="#2d3142"/>
  <rect x="220" y="264" width="144" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
  <rect x="228" y="272" width="32" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.22" stroke-width="0.8"/>
  <text x="244" y="281" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
  <text x="356" y="324" fill="#f5f5f5" fill-opacity="0.06" font-size="32" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">01</text>
  <text x="292" y="300" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Cloudflare</text>
  <text x="292" y="316" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Pages · cache</text>

  <!-- Node: Astro (focal) -->
  <rect x="416" y="264" width="160" height="64" rx="6" fill="#2d3142"/>
  <rect x="416" y="264" width="160" height="64" rx="6" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
  <rect x="424" y="272" width="32" height="12" rx="2" fill="none" stroke="#f08a59" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="440" y="281" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
  <text x="568" y="324" fill="#f08a59" fill-opacity="0.10" font-size="32" font-weight="600" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end">02</text>
  <text x="496" y="300" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Astro Origin</text>
  <text x="496" y="316" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">SSR + MDX</text>

  <!-- Node: MDX Bundle -->
  <rect x="628" y="184" width="144" height="64" rx="6" fill="#2d3142"/>
  <rect x="628" y="184" width="144" height="64" rx="6" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <rect x="636" y="192" width="32" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-opacity="0.40" stroke-width="0.8"/>
  <text x="652" y="201" fill="#f5f5f5" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">BUN</text>
  <text x="700" y="220" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">MDX Bundle</text>
  <text x="700" y="236" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">src/content/*.mdx</text>

  <!-- Node: Content CMS -->
  <rect x="628" y="344" width="144" height="64" rx="6" fill="#2d3142"/>
  <rect x="628" y="344" width="144" height="64" rx="6" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
  <rect x="636" y="352" width="28" height="12" rx="2" fill="none" stroke="#bfc0c0" stroke-opacity="0.50" stroke-width="0.8"/>
  <text x="650" y="361" fill="#bfc0c0" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CMS</text>
  <text x="700" y="380" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Content CMS</text>
  <text x="700" y="396" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">assets · og images</text>

  <!-- Legend strip -->
  <line x1="40" y1="428" x2="960" y2="428" stroke="#f5f5f5" stroke-opacity="0.10" stroke-width="0.8"/>
  <text x="40" y="444" fill="#bfc0c0" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.18em">LEGEND</text>

  <rect x="40" y="460" width="14" height="10" rx="2" fill="#f08a59" fill-opacity="0.08" stroke="#f08a59" stroke-width="1"/>
  <text x="60" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Focal / origin</text>

  <rect x="160" y="460" width="14" height="10" rx="2" fill="#393e53" stroke="#f5f5f5" stroke-width="1"/>
  <text x="180" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Backend / bundle</text>

  <rect x="296" y="460" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.05" stroke="#bfc0c0" stroke-width="1"/>
  <text x="316" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Store</text>

  <rect x="376" y="460" width="14" height="10" rx="2" fill="#f5f5f5" fill-opacity="0.03" stroke="#f5f5f5" stroke-opacity="0.30" stroke-width="1"/>
  <text x="396" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Cloud</text>

  <rect x="456" y="460" width="14" height="10" rx="2" fill="#bfc0c0" fill-opacity="0.10" stroke="#949eb2" stroke-width="1"/>
  <text x="476" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">External</text>

  <line x1="552" y1="466" x2="580" y2="466" stroke="#739fdf" stroke-width="1.2" marker-end="url(#architecture-dark-arrow-link)"/>
  <text x="588" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">HTTP request</text>

  <line x1="684" y1="466" x2="712" y2="466" stroke="#f08a59" stroke-width="1.4" marker-end="url(#architecture-dark-arrow-accent)"/>
  <text x="720" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Primary flow</text>

  <line x1="812" y1="466" x2="840" y2="466" stroke="#bfc0c0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#architecture-dark-arrow)"/>
  <text x="848" y="468" fill="#bfc0c0" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Return / async</text>
</svg>
